# Development overrides for docker-compose
# This file is automatically loaded by docker-compose in development
version: '3.8'

services:
  api:
    build:
      target: production
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - RELOAD=true
    volumes:
      - ./services/api/src:/app/src:ro
      - ./services/api/tests:/app/tests:ro
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      target: base
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./apps:/app/apps:ro
      - ./packages:/app/packages:ro
    command: ["pnpm", "dev:hardcard"]
    ports:
      - "3000:3000"
      - "24678:24678"  # Vite HMR

  postgres:
    environment:
      POSTGRES_DB: hardcard_dev
    ports:
      - "5433:5432"  # Different port for dev to avoid conflicts

  redis:
    ports:
      - "6380:6379"  # Different port for dev