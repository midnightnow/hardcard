# Alexandria API - Cloud Run Deployment Configuration

# cloudbuild.yaml - For automated deployment
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/alexandria-api:$COMMIT_SHA', '.']
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alexandria-api:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'alexandria-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/alexandria-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID,ENV=production'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '100'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '60'
      - '--concurrency'
      - '100'

# Tag the image as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/alexandria-api:$COMMIT_SHA', 'gcr.io/$PROJECT_ID/alexandria-api:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alexandria-api:latest']

# service.yaml - Cloud Run service configuration
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alexandria-api
  namespace: hardcard-firebase-studio
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      serviceAccountName: alexandria-api@hardcard-firebase-studio.iam.gserviceaccount.com
      containers:
        - image: gcr.io/hardcard-firebase-studio/alexandria-api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PROJECT_ID
              value: hardcard-firebase-studio
            - name: ENV
              value: production
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

---
# monitoring.yaml - Monitoring dashboard configuration
displayName: Alexandria API Dashboard
mosaicLayout:
  columns: 12
  tiles:
    - width: 6
      height: 4
      widget:
        title: Request Rate
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_RATE
          timeshiftDuration: 0s
          yAxis:
            label: requests/sec
            scale: LINEAR
    
    - xPos: 6
      width: 6
      height: 4
      widget:
        title: Latency (p50, p95, p99)
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_DELTA
                    crossSeriesReducer: REDUCE_PERCENTILE_50
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_DELTA
                    crossSeriesReducer: REDUCE_PERCENTILE_95
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_DELTA
                    crossSeriesReducer: REDUCE_PERCENTILE_99
          yAxis:
            label: latency (ms)
            scale: LINEAR
    
    - yPos: 4
      width: 6
      height: 4
      widget:
        title: Error Rate
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.labels.response_code_class="4xx"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_RATE
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.labels.response_code_class="5xx"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_RATE
          yAxis:
            label: errors/sec
            scale: LINEAR
    
    - xPos: 6
      yPos: 4
      width: 6
      height: 4
      widget:
        title: Container Instances
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.type="run.googleapis.com/container/instance_count"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_MEAN
          yAxis:
            label: instances
            scale: LINEAR

---
# alerting.yaml - Alert policies
- displayName: "Alexandria API - High Error Rate"
  conditions:
    - displayName: "Error rate > 1%"
      conditionThreshold:
        filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.type="run.googleapis.com/request_count" metric.labels.response_code_class="5xx"
        aggregations:
          - alignmentPeriod: 60s
            perSeriesAligner: ALIGN_RATE
        comparison: COMPARISON_GT
        thresholdValue: 0.01
        duration: 300s
  notificationChannels:
    - projects/hardcard-firebase-studio/notificationChannels/YOUR_CHANNEL_ID
  alertStrategy:
    autoClose: 1800s

- displayName: "Alexandria API - High Latency"
  conditions:
    - displayName: "P95 latency > 5s"
      conditionThreshold:
        filter: resource.type="cloud_run_revision" resource.labels.service_name="alexandria-api" metric.type="run.googleapis.com/request_latencies"
        aggregations:
          - alignmentPeriod: 60s
            perSeriesAligner: ALIGN_DELTA
            crossSeriesReducer: REDUCE_PERCENTILE_95
        comparison: COMPARISON_GT
        thresholdValue: 5000
        duration: 300s
  notificationChannels:
    - projects/hardcard-firebase-studio/notificationChannels/YOUR_CHANNEL_ID