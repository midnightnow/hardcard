<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardCard Members Area - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .glass {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        
        .input-field {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px 12px 45px;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.5);
        }
        
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .glow {
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #6366f1, 0 0 20px #6366f1; }
            to { text-shadow: 0 0 20px #6366f1, 0 0 30px #6366f1; }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            <!-- Logo and Title -->
            <div class="text-center mb-8 float-animation">
                <i class="fas fa-crown text-6xl text-yellow-400 mb-4 glow"></i>
                <h1 class="text-3xl font-bold mb-2">HardCard Members Area</h1>
                <p class="text-gray-400">Access your private dashboard</p>
            </div>
            
            <!-- Login Form -->
            <div class="glass rounded-lg p-8">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="mb-6">
                        <label class="block text-sm font-medium mb-2">Email Address</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="email" 
                                id="email" 
                                class="input-field rounded-lg" 
                                placeholder="admin@hardcard.ai"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium mb-2">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="password" 
                                class="input-field rounded-lg" 
                                placeholder="••••••••"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center">
                            <input type="checkbox" class="mr-2">
                            <span class="text-sm">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-primary hover:text-purple-400">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary w-full py-3 rounded-lg text-white font-semibold">
                        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                    </button>
                </form>
                
                <!-- Demo Notice -->
                <div class="mt-6 p-4 bg-blue-900 bg-opacity-30 rounded-lg">
                    <p class="text-sm text-center">
                        <i class="fas fa-info-circle text-blue-400 mr-2"></i>
                        Demo Mode: Use any email/password to access
                    </p>
                </div>
                
                <!-- Alternative Login -->
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-600"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-gray-800 text-gray-400">Or continue with</span>
                        </div>
                    </div>
                    
                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button class="glass py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors">
                            <i class="fab fa-google mr-2"></i>Google
                        </button>
                        <button class="glass py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors">
                            <i class="fab fa-github mr-2"></i>GitHub
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="text-center mt-8 text-sm text-gray-400">
                <p>Protected by enterprise-grade security</p>
                <p class="mt-2">
                    <i class="fas fa-shield-alt text-green-400 mr-1"></i>
                    SSL Encrypted • 
                    <i class="fas fa-lock text-green-400 mx-1"></i>
                    2FA Available • 
                    <i class="fas fa-server text-green-400 mx-1"></i>
                    Secure Storage
                </p>
            </div>
        </div>
    </div>
    
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simple demo authentication
            // In production, this would validate against a secure backend
            if (email && password) {
                // Store auth state
                localStorage.setItem('hardcard_auth', JSON.stringify({
                    email: email,
                    authenticated: true,
                    timestamp: new Date().toISOString()
                }));
                
                // Redirect to members area
                window.location.href = '/members-area.html';
            }
        }
        
        // Check if already authenticated
        document.addEventListener('DOMContentLoaded', function() {
            const auth = localStorage.getItem('hardcard_auth');
            if (auth) {
                const authData = JSON.parse(auth);
                // Check if auth is less than 24 hours old
                const authTime = new Date(authData.timestamp);
                const now = new Date();
                const hoursDiff = (now - authTime) / (1000 * 60 * 60);
                
                if (hoursDiff < 24) {
                    window.location.href = '/members-area.html';
                } else {
                    localStorage.removeItem('hardcard_auth');
                }
            }
        });
    </script>
</body>
</html>
