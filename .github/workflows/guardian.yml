name: Guardian - Prevent Private Code Leaks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-for-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for forbidden paths
        run: |
          FORBIDDEN_PATHS=(
            "vet"
            "veterinary"
            "gemini"
            "claude"
            "kimi"
            "moex"
            "games"
            "unicorn"
            "ai-lab"
            "personal"
            "nexus"
            "marketplace"
            "frontend"
            "backend"
            "deploy"
          )
          
          for path in "${FORBIDDEN_PATHS[@]}"; do
            if git ls-files | grep -i "$path"; then
              echo "❌ Forbidden path detected: $path"
              exit 1
            fi
          done
          echo "✅ No forbidden paths detected"
      
      - name: Enforce size discipline
        run: |
          MAX_LINES=1000
          if [ -d "hardcard" ]; then
            LINES=$(find hardcard -name "*.py" | xargs cat 2>/dev/null | wc -l)
            if [ "$LINES" -gt "$MAX_LINES" ]; then
              echo "❌ Core exceeds $MAX_LINES lines ($LINES)"
              exit 1
            fi
          fi
          echo "✅ Size check passed"
