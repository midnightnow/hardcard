[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardcard"
version = "1.1.0"
description = "Hardcard Settlement Layer - Build With Gold"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sovereign Clinical Alliance"}
]
keywords = ["ai", "economy", "settlement", "autonomous", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "click>=8.0.0",
]

[project.scripts]
hardcard = "hardcard.cli:main"

[project.urls]
"Homepage" = "https://github.com/midnightnow/hardcard"
"Documentation" = "https://github.com/midnightnow/hardcard#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["hardcard"]
exclude = ["hardcard-governance*", "hardcard_core*", "hardcard-suite*"]